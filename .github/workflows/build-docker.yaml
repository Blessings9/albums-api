name: Go

on:
  push:
    branches: [ "gaflows" ]
  pull_request:
    branches: [ "gaflows" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'
    - name: Install dependencies
      run: go mod tidy

    - name: Build
      run: go build -v ./...
